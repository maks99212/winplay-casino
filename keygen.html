<!DOCTYPE html>
<html lang="ru">
<head>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="db.js"></script>
    <!-- Подключаем официальный SDK Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
    // Ждём, пока SDK загрузится
    window.addEventListener('load', function() {
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            
            // Сообщаем Telegram, что приложение готово
            tg.ready();
            
            // Разворачиваем приложение на весь экран (убирает лишние отступы)
            tg.expand();

            // (Опционально) Можно получить данные пользователя Telegram
            // const user = tg.initDataUnsafe.user;
            // console.log('Пользователь:', user);
        } else {
            console.log('Приложение открыто вне Telegram');
        }
    });
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Ключей | Rocket Casino</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1c1f26;
            --text: #e6e8ee;
            --muted: #8b92a5;
            --border: #2a2e39;
            --accent: #5b8cff;
            --gold: #ffd166;
            --green: #22c55e;
            --red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .keygen-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-weight: 900;
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .logo span { color: var(--accent); }

        h2 {
            font-size: 1.2rem;
            color: var(--muted);
            margin-bottom: 30px;
            font-weight: 600;
        }

        .key-display {
            background: var(--bg);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 2px;
            margin-bottom: 24px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
        }

        .btn {
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #5b8cff, #3b5bdb);
            color: #fff;
            box-shadow: 0 4px 15px rgba(91, 140, 255, 0.3);
        }
        .btn-generate:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .btn-copy {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-copy:hover { background: #252932; border-color: var(--accent); }

        .btn-admin {
            background: var(--green);
            color: #fff;
            text-decoration: none;
            display: block;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 800;
            transition: all 0.2s;
            margin-top: 24px;
        }
        .btn-admin:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .status-text {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="keygen-box">
        <div class="logo">Rocket<span>Casino</span></div>
        <h2>Генератор ключей доступа к Админке</h2>

        <div class="key-display" id="keyDisplay">Нажмите "Сгенерировать"</div>
        
        <div class="status-text" id="statusText"></div>

        <button class="btn btn-generate" onclick="generateKey()">
            🎲 Сгенерировать новый ключ
        </button>
        
        <button class="btn btn-copy" onclick="copyKey()">
            📋 Скопировать ключ
        </button>

        <a href="admin.html" class="btn-admin">
            Перейти в Админ-панель →
        </a>
    </div>

    <script>
        const CHARSET = 'abcdefghijklmnopqrstuvwxyz_0123456789!@#$&';
        const KEY_LENGTH = 20;

        function generateKey() {
            let key = '';
            for (let i = 0; i < KEY_LENGTH; i++) {
                const randomIndex = Math.floor(Math.random() * CHARSET.length);
                key += CHARSET[randomIndex];
            }
            
            // Отображаем на экране
            document.getElementById('keyDisplay').textContent = key;
            document.getElementById('keyDisplay').style.color = '#fff';
            
            // Сохраняем в localStorage для проверки в админке
            localStorage.setItem('admin_access_key', key);
            
            // Показываем статус
            const st = document.getElementById('statusText');
            st.textContent = 'Ключ сгенерирован и сохранён в браузере!';
            st.style.color = 'var(--green)';
            setTimeout(() => { st.textContent = ''; }, 3000);
        }

        function copyKey() {
            const key = document.getElementById('keyDisplay').textContent;
            if (key === 'Нажмите "Сгенерировать"') return;

            navigator.clipboard.writeText(key).then(() => {
                const st = document.getElementById('statusText');
                st.textContent = 'Ключ скопирован в буфер обмена!';
                st.style.color = 'var(--accent)';
                setTimeout(() => { st.textContent = ''; }, 3000);
            });
        }
    </script>
</body>
</html>
