<html lang="ru">
<head>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="db.js"></script>
    <!-- Подключаем официальный SDK Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
    // Ждём, пока SDK загрузится
    window.addEventListener('load', function() {
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            
            // Сообщаем Telegram, что приложение готово
            tg.ready();
            
            // Разворачиваем приложение на весь экран (убирает лишние отступы)
            tg.expand();

            // (Опционально) Можно получить данные пользователя Telegram
            // const user = tg.initDataUnsafe.user;
            // console.log('Пользователь:', user);
        } else {
            console.log('Приложение открыто вне Telegram');
        }
    });
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinflip | Winplay</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1c1f26;
            --text: #e6e8ee;
            --muted: #8b92a5;
            --border: #2a2e39;
            --accent: #5b8cff;
            --gold: #ffd166;
            --green: #22c55e;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== ШАПКА ========== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 17, 21, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .logo {
            font-weight: 900;
            font-size: 1.4rem;
            color: #fff;
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
        }
        .logo span { color: var(--accent); }

        .user-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .balance {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .balance b { color: var(--gold); }

        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #252932;
            transform: translateY(-1px);
        }
        .btn-primary {
            background: var(--accent);
            border: none;
            color: #fff;
        }
        .btn-primary:hover { background: #4a7aff; }

        .profile-widget {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            padding: 4px 12px 4px 4px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--text);
        }
        .profile-widget:hover { border-color: var(--accent); }
        .avatar-mini {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .profile-id {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 600;
        }

        /* ========== ОСНОВНОЙ КОНТЕНТ ========== */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            width: 100%;
        }

        .game-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .back-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .back-btn:hover { color: #fff; border-color: #fff; }

        /* ========== COINFLIP ========== */
        .cf-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            max-width: 600px;
            margin: 0 auto 90px;
        }

        .cf-mode-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .cf-mode-btn {
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-weight: 700;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cf-mode-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 10px rgba(91, 140, 255, 0.3);
        }
        .cf-mode-btn:hover:not(.active) {
            color: #fff;
        }
        .cf-mode-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .cf-coin-wrap {
            perspective: 800px;
            width: 140px;
            height: 140px;
            margin: 26px auto 18px;
            position: relative;
        }

        .cf-coin {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.8s cubic-bezier(0.25, 0.9, 0.3, 1);
        }
        .cf-coin .side {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            backface-visibility: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.4);
            border: 4px solid rgba(255, 255, 255, 0.15);
        }
        .cf-coin .side-heads {
            background: radial-gradient(circle at 30% 30%, #ffe08a, #e0a930);
        }
        .cf-coin .side-tails {
            background: radial-gradient(circle at 30% 30%, #7aa6ff, #3458c9);
            transform: rotateY(180deg);
        }

        .cf-stats {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin: 18px 0;
            font-size: 0.95rem;
        }
        .cf-stats .item { text-align: center; }
        .cf-stats .lbl {
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .cf-stats .val {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--gold);
        }

        .cf-choice {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 18px;
        }
        .cf-choice-btn {
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: #fff;
            cursor: pointer;
            font-weight: 800;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .cf-choice-btn:hover:not(:disabled) {
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .cf-choice-btn.active {
            border-color: var(--accent);
            background: rgba(91, 140, 255, 0.15);
            box-shadow: 0 0 0 2px rgba(91, 140, 255, 0.35);
        }
        .cf-choice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .cf-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .cf-actions.single {
            grid-template-columns: 1fr;
        }
        .cf-action-btn {
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .cf-action-btn.play {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }
        .cf-action-btn.play:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .cf-action-btn.cashout {
            background: linear-gradient(135deg, #ffd166, #f59e0b);
            color: #111;
            box-shadow: 0 4px 15px rgba(255, 209, 102, 0.3);
        }
        .cf-action-btn.cashout:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .cf-action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            filter: none;
            box-shadow: none;
        }

        /* ========== ХОТБАР ========== */
        .hotbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(28, 31, 38, 0.98);
            border-top: 1px solid var(--border);
            padding: 14px;
            display: flex;
            justify-content: center;
            z-index: 200;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .hotbar input {
            width: 120px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: #fff;
            outline: none;
        }
        .hotbar .hotbar-label {
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* ========== ТОСТ ========== */
        .toast {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 12px;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s;
            max-width: 340px;
            font-weight: 600;
        }
        .toast.show { transform: translateX(0); }
        .toast.win { border-color: var(--green); }
        .toast.lose { border-color: var(--red); }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a class="logo" href="index.html">Win<span>play</span></a>

            <div class="user-box" id="userBox" style="display:none;">
                <div class="balance">Баланс: <b id="balanceDisplay">0.00</b> ₽</div>
                <a class="profile-widget" href="profile.html">
                    <div class="avatar-mini" id="headerAvatar">👤</div>
                    <div class="profile-id" id="headerId">#0000</div>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="game-header">
            <a class="back-btn" href="index.html">← В лобби</a>
            <h2>🪙 Coinflip</h2>
        </div>

        <div class="cf-panel">
            <div class="cf-mode-switch">
                <button class="cf-mode-btn active" data-mode="single" onclick="setCfMode('single')">1 ход за ставку</button>
                <button class="cf-mode-btn" data-mode="multi" onclick="setCfMode('multi')">Несколько ходов</button>
            </div>

            <div class="cf-coin-wrap">
                <div class="cf-coin" id="cfCoin">
                    <div class="side side-heads">🦅</div>
                    <div class="side side-tails">🪙</div>
                </div>
            </div>

            <div class="cf-stats">
                <div class="item">
                    <div class="lbl">Ставка</div>
                    <div class="val" id="cfBetVal">0.00 ₽</div>
                </div>
                <div class="item">
                    <div class="lbl">Множитель</div>
                    <div class="val" id="cfMultVal">×1.00</div>
                </div>
                <div class="item">
                    <div class="lbl">К выплате</div>
                    <div class="val" id="cfPayoutVal">0.00 ₽</div>
                </div>
            </div>

            <div class="cf-choice">
                <button class="cf-choice-btn active" id="cfHeadsBtn" onclick="setCfSide('heads')">🦅 Орёл</button>
                <button class="cf-choice-btn" id="cfTailsBtn" onclick="setCfSide('tails')">🪙 Решка</button>
            </div>

            <div class="cf-actions" id="cfActions">
                <button class="cf-action-btn play" id="cfPlayBtn" onclick="cfPlay()">Играть</button>
                <button class="cf-action-btn cashout" id="cfCashoutBtn" onclick="cfCashout()" style="display:none;">Забрать</button>
            </div>
        </div>
    </main>

    <div class="hotbar">
        <span class="hotbar-label">Ставка:</span>
        <input type="number" id="globalBet" value="10.00" min="1" step="0.01">
        <button class="btn btn-primary" onclick="saveGlobalBet()">Сохранить ставку</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /* ========== КЛЮЧИ ХРАНИЛИЩА ========== */
        const U_KEY = 'roulette_users_v1';
        const S_KEY = 'roulette_session_v1';
        const G_KEY = 'roulette_game_settings_v1';

        const load = (k, d) => {
            try {
                const r = localStorage.getItem(k);
                return r ? JSON.parse(r) : d;
            } catch (e) { return d; }
        };
        const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

        let users = load(U_KEY, {});
        let curUser = load(S_KEY, null);

        if (!curUser || !users[curUser]) {
            location.href = 'index.html';
        }

        // Загружаем настройки игры
        const gameSettings = load(G_KEY, {});
        const cfSettings = gameSettings.coinflip || { enabled: true, minBet: 10, maxBet: 10000, winChance: 50 };

        if (cfSettings.enabled === false) {
            alert('Игра находится на техническом перерыве');
            location.href = 'index.html';
        }

        /* ========== УТИЛИТЫ ========== */
        function getBal() {
            return curUser && users[curUser] ? users[curUser].balance : 0;
        }

        function setBal(v) {
            if (!curUser) return;
            users[curUser].balance = Math.max(0, parseFloat(v.toFixed(2)));
            save(U_KEY, users);
            refreshUI();
        }

        function addWager(amt) {
            if (!curUser || !users[curUser].wagerRequired) return;
            users[curUser].wagerProgress = (users[curUser].wagerProgress || 0) + amt;
            if (users[curUser].wagerProgress >= users[curUser].wagerRequired) {
                users[curUser].wagerRequired = 0;
                users[curUser].wagerProgress = 0;
                showToast('🎉 Вейджер отыгран! Средства разблокированы.', 'win');
            }
            save(U_KEY, users);
        }

        function showToast(txt, type = '') {
            const t = document.getElementById('toast');
            t.textContent = txt;
            t.className = 'toast show ' + type;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function refreshUI() {
            document.getElementById('userBox').style.display = curUser ? 'flex' : 'none';
            if (!curUser) return;

            const u = users[curUser];
            const cleanId = String(u.id || '').padStart(4, '0');
            document.getElementById('balanceDisplay').textContent = getBal().toFixed(2);
            document.getElementById('headerAvatar').textContent = u.avatar || '👤';
            document.getElementById('headerId').textContent = '#' + cleanId;
        }

        function saveGlobalBet() {
            const v = parseFloat(document.getElementById('globalBet').value);
            if (v > 0) {
                showToast('Ставка сохранена: ' + v.toFixed(2) + ' ₽', 'win');
            }
        }

        /* ========== ИГРА: COINFLIP ========== */
        const CF_MULT = 1.96; 

        const cf = {
            mode: 'single',       
            side: 'heads',        
            rolling: false,
            active: false,
            bet: 0,
            streak: 0,            
            rotation: 0
        };

        function setCfMode(mode) {
            if (cf.rolling) return;
            if (cf.active) return showToast('Сначала завершите текущую игру', 'lose');
            cf.mode = mode;
            document.querySelectorAll('.cf-mode-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.mode === mode);
            });
            document.getElementById('cfCashoutBtn').style.display = mode === 'multi' ? 'block' : 'none';
            document.getElementById('cfActions').className = 'cf-actions ' + (mode === 'single' ? 'single' : '');
            cfUpdateStats();
        }

        // ИСПРАВЛЕННАЯ ФУНКЦИЯ: теперь проверяем только rolling, а не active.
        function setCfSide(side) {
            // Если крутится анимация - блокируем. Если просто active (в мультирежиме ждем броска) - разрешаем.
            if (cf.rolling) return; 
            
            cf.side = side;
            document.getElementById('cfHeadsBtn').classList.toggle('active', side === 'heads');
            document.getElementById('cfTailsBtn').classList.toggle('active', side === 'tails');
        }

        function cfUpdateStats() {
            const bet = parseFloat(document.getElementById('globalBet').value) || 0;

            if (cf.mode === 'single') {
                document.getElementById('cfBetVal').textContent = bet.toFixed(2) + ' ₽';
                document.getElementById('cfMultVal').textContent = '×' + CF_MULT.toFixed(2);
                document.getElementById('cfPayoutVal').textContent = (bet * CF_MULT).toFixed(2) + ' ₽';
            } else {
                document.getElementById('cfBetVal').textContent = cf.bet.toFixed(2) + ' ₽';
                const mult = Math.pow(CF_MULT, cf.streak);
                document.getElementById('cfMultVal').textContent = '×' + mult.toFixed(2);
                document.getElementById('cfPayoutVal').textContent = (cf.bet * mult).toFixed(2) + ' ₽';
            }
        }

        function cfSetDisabled(disabled) {
            document.getElementById('cfHeadsBtn').disabled = disabled;
            document.getElementById('cfTailsBtn').disabled = disabled;
            document.getElementById('cfPlayBtn').disabled = disabled;
            document.getElementById('cfCashoutBtn').disabled = disabled;
        }

        function cfFlipTo(resultSide) {
            const targetBase = resultSide === 'tails' ? 180 : 0;
            const currentMod = ((cf.rotation % 360) + 360) % 360;
            const targetMod = ((targetBase % 360) + 360) % 360;
            let delta = targetMod - currentMod;
            if (delta < 0) delta += 360;
            cf.rotation += 360 * 4 + delta;
            const coin = document.getElementById('cfCoin');
            coin.style.transform = `rotateY(${cf.rotation}deg)`;
        }

        function cfPlay() {
            if (cf.rolling) return;

            const bet = parseFloat(document.getElementById('globalBet').value);
            if (!bet || bet <= 0) return showToast('Ставка?', 'lose');

            // Проверка лимитов
            if (bet < cfSettings.minBet) return showToast(`Мин. ставка: ${cfSettings.minBet} ₽`, 'lose');
            if (bet > cfSettings.maxBet) return showToast(`Макс. ставка: ${cfSettings.maxBet} ₽`, 'lose');

            if (cf.mode === 'single') {
                if (bet > getBal()) return showToast('Недостаточно средств', 'lose');
                
                setBal(getBal() - bet);
                addWager(bet);

                // Статистика
                users[curUser].totalBets = (users[curUser].totalBets || 0) + bet;
                if (!users[curUser].history) users[curUser].history = [];
                users[curUser].history.unshift({ type: 'bet', amount: bet, date: new Date().toLocaleString('ru-RU', { hour: '2-digit', minute: '2-digit' }), details: 'Coinflip игра' });
                if (users[curUser].history.length > 20) users[curUser].history.pop();
                save(U_KEY, users);

                cf.rolling = true;
                cfSetDisabled(true);

                // Логика шанса Админа
                const adminWinChance = cfSettings.winChance !== undefined ? cfSettings.winChance : 50;
                const isAdminWin = (Math.random() * 100) < adminWinChance;
                const win = isAdminWin ? cf.side : (cf.side === 'heads' ? 'tails' : 'heads');
                
                cfFlipTo(win);

                setTimeout(() => {
                    if (isAdminWin) {
                        const winAmt = bet * CF_MULT;
                        setBal(getBal() + winAmt);
                        showToast(`🎉 +${winAmt.toFixed(2)} ₽`, 'win');
                        
                        users[curUser].history.unshift({ type: 'win', amount: winAmt, date: new Date().toLocaleString('ru-RU', { hour: '2-digit', minute: '2-digit' }), details: 'Coinflip выигрыш' });
                        if (users[curUser].history.length > 20) users[curUser].history.pop();
                        save(U_KEY, users);
                    } else {
                        showToast('Проигрыш', 'lose');
                    }
                    cf.rolling = false;
                    cfSetDisabled(false);
                }, 1900);
            } else {
                if (!cf.active) {
                    if (bet > getBal()) return showToast('Недостаточно средств', 'lose');
                    setBal(getBal() - bet);
                    addWager(bet);
                    cf.active = true;
                    cf.bet = bet;
                    cf.streak = 0;
                    cfUpdateStats();

                    // Статистика
                    users[curUser].totalBets = (users[curUser].totalBets || 0) + bet;
                    if (!users[curUser].history) users[curUser].history = [];
                    users[curUser].history.unshift({ type: 'bet', amount: bet, date: new Date().toLocaleString('ru-RU', { hour: '2-digit', minute: '2-digit' }), details: 'Coinflip (серия)' });
                    if (users[curUser].history.length > 20) users[curUser].history.pop();
                    save(U_KEY, users);
                }

                cf.rolling = true;
                cfSetDisabled(true);

                const adminWinChance = cfSettings.winChance !== undefined ? cfSettings.winChance : 50;
                const isAdminWin = (Math.random() * 100) < adminWinChance;
                const win = isAdminWin ? cf.side : (cf.side === 'heads' ? 'tails' : 'heads');
                
                cfFlipTo(win);

                setTimeout(() => {
                    cf.rolling = false;

                    if (isAdminWin) {
                        cf.streak++;
                        cfUpdateStats();
                        // Разблокируем всё, кроме кнопки "Забрать" (она нужна для вывода)
                        document.getElementById('cfPlayBtn').disabled = false;
                        document.getElementById('cfCashoutBtn').disabled = false;
                        document.getElementById('cfHeadsBtn').disabled = false;
                        document.getElementById('cfTailsBtn').disabled = false;
                        showToast(`✅ Угадал! Множитель ×${Math.pow(CF_MULT, cf.streak).toFixed(2)}`, 'win');
                    } else {
                        const lost = cf.bet * Math.pow(CF_MULT, cf.streak);
                        cf.active = false;
                        cf.bet = 0;
                        cf.streak = 0;
                        cfUpdateStats();
                        cfSetDisabled(false);
                        showToast(`Проигрыш −${lost.toFixed(2)} ₽`, 'lose');
                    }
                }, 1900);
            }
        }

        function cfCashout() {
            if (cf.mode !== 'multi' || !cf.active || cf.streak === 0 || cf.rolling) return;

            const win = cf.bet * Math.pow(CF_MULT, cf.streak);
            setBal(getBal() + win);

            // История
            users[curUser].history.unshift({ type: 'win', amount: win, date: new Date().toLocaleString('ru-RU', { hour: '2-digit', minute: '2-digit' }), details: 'Coinflip кэшаут' });
            if (users[curUser].history.length > 20) users[curUser].history.pop();
            save(U_KEY, users);

            cf.active = false;
            cf.streak = 0;
            cf.bet = 0;
            cfUpdateStats();
            cfSetDisabled(false);

            showToast(`💰 Забрали ${win.toFixed(2)} ₽`, 'win');
        }

        /* ========== СТАРТ ========== */
        refreshUI();
        setCfSide('heads');
        cfUpdateStats();

        const globalBetInput = document.getElementById('globalBet');
        globalBetInput.addEventListener('input', () => {
            if (cf.mode === 'single') cfUpdateStats();
        });
    </script>
</body>
</html>
